<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0c12; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; background: #2e3d24; max-width: 100vw; max-height: 100vh; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    color: rgba(232, 226, 200, 0.65); font-size: 12px; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hint">WASD drive &amp; walk &nbsp;•&nbsp; E get in a car &nbsp;•&nbsp; Mouse aim, click to shoot &nbsp;•&nbsp; F Spray &amp; Save &nbsp;•&nbsp; P pause &nbsp;•&nbsp; L snapshot</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
